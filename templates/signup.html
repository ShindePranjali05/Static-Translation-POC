<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Healthcare Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

    <header class="main-header">
        <div class="logo-title" data-translate="app_name">Recoup</div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="brand-box">
                <h1 data-translate="portal_title">Healthcare Portal</h1>
                <p data-translate="signup_intro">
                    Create your account and get secure access to the healthcare system.
                </p>
            </div>
        </div>

        <div class="auth-right">
            <div class="form-card">
                <h2 data-translate="signup_heading">Create Account</h2>
                <p class="form-subtitle" data-translate="signup_subtitle">Fill in your details to get started</p>
                <div id="signupMessage" class="form-message"></div>

                <form id="signupForm">
                    <div class="input-group">
                        <label for="signupEmail" data-translate="email_label">Email Address</label>
                        <input type="email" id="signupEmail" data-translate-placeholder="email_placeholder" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="signupPassword" data-translate="password_label">Password</label>
                        <input type="password" id="signupPassword" data-translate-placeholder="password_placeholder" placeholder="Enter your password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword" data-translate="confirm_password">Confirm Password</label>
                        <input type="password" id="confirmPassword" data-translate-placeholder="confirm_password_placeholder" placeholder="Confirm your password" required>
                    </div>

                    <div class="input-group">
                        <label for="preferredLanguage" data-translate="preferred_language">Preferred Language</label>
                        <select id="preferredLanguage" required>
                            <option value="en">English</option>
                            <option value="hi">हिंदी</option>
                            <option value="mr">मराठी</option>
                            <option value="gu">ગુજરાતી</option>
                            <option value="te">తెలుగు</option>
                        </select>
                    </div>

                    <button type="submit" class="primary-btn" data-translate="create_account_btn">Create Account</button>
                </form>

                <p class="switch-text">
                    <span data-translate="already_account">Already have an account?</span>
                    <a href="/login" data-translate="login_link">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/translate.js') }}"></script>
    <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
